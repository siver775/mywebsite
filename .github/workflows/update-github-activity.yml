name: Update GitHub contribution SVG

# Refreshes the contribution heatmap daily from real, tokenless data.
# Runs daily, on every push to main, and on-demand.

"on":
  schedule:
    - cron: "0 0 * * *"   # ~00:00 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph"
          file_pattern: "data/contributions.json public/contrib-heatmap.svg"

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nextjs.yml --ref main